<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/jabuti.png" />
    <title>Jabuti</title>
  </head>
  <body>
    <div id="preloader">
      <div class="img">
        <img src="/assets/jabuti.png" alt="" id="loader" />
      </div>
    </div>

    <div class="app">
      <img src="/assets/tutorial.png" alt="" id="tutorial" class="tutorial" />
      <div class="toolbox">
        <div id="blocklyDiv"></div>
        <div class="botoes">
          <button class="botao" id="play">
            <span>Executar</span>
            <img src="/assets/play.png" alt="" />
          </button>
          <button class="botao" id="stop" disabled>
            <span>Parar Execução</span>
            <img src="/assets/stop.png" alt="" />
          </button>
          <button class="botao" id="clear">
            <span>Limpar Tela</span>
            <img src="/assets/trashcan.png" alt="" />
          </button>
          <button class="botao" id="undo">
            <span>Desfazer</span>
            <img src="/assets/undo.png" alt="" />
          </button>
          <button class="botao" id="redo">
            <span>Refazer</span>
            <img src="/assets/redo.png" alt="" />
          </button>
          <div class="velocidade">
            <span>Velocidade de Execução</span>
            <input
              type="range"
              value="25"
              min="5"
              max="100"
              step="5"
              class="speedRoll"
              id="velocidade"
            />
          </div>
          <div class="velocidade">
            <span>Tamanho do passo</span>
            <input
              type="range"
              value="8"
              min="1"
              max="32"
              class="speedRoll"
              id="passo"
            />
            <output id="passo-valor">8</output>
          </div>
        </div>
      </div>
      <div id="simulacao"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
