<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/assets/jabuti.png" />
    <title>Jabuti</title>
  </head>
  <body>
    <div id="preloader">
      <div class="img">
        <img src="/assets/jabuti.png" alt="" id="loader" />
      </div>
    </div>

    <div class="app">
      <img src="/assets/tutorial.png" alt="" id="tutorial" class="tutorial" />
      <div class="toolbox">
        <div id="blocklyDiv"></div>
        <div class="botoes">
          <button class="botao" id="play">
            <span>Executar</span>
            <img src="/assets/play.png" alt="" />
          </button>
          <button class="botao" id="stop" disabled>
            <span>Parar Execução</span>
            <img src="/assets/stop.png" alt="" />
          </button>
          <button class="botao" id="undo">
            <span>Desfazer</span>
            <img src="/assets/undo.png" alt="" />
          </button>
          <button class="botao" id="redo">
            <span>Refazer</span>
            <img src="/assets/redo.png" alt="" />
          </button>
          <div class="velocidade">
            <span>Velocidade de Execução</span>
            <img
              class="slider-icon"
              src="/assets/speed.png"
              alt="Velocidade de execução"
            />
            <input
              type="range"
              value="25"
              min="5"
              max="100"
              step="5"
              class="speedRoll"
              id="velocidade"
            />
          </div>
          <div class="velocidade">
            <span>Tamanho do passo</span>
            <svg
              class="slider-icon"
              viewBox="0 0 16 16"
              shape-rendering="crispEdges"
              role="img"
              aria-label="Tamanho do passo"
            >
              <rect x="1" y="5" width="14" height="6" fill="#ddd" />
              <rect x="3" y="5" width="1" height="3" fill="#212529" />
              <rect x="6" y="5" width="1" height="2" fill="#212529" />
              <rect x="9" y="5" width="1" height="3" fill="#212529" />
              <rect x="12" y="5" width="1" height="2" fill="#212529" />
            </svg>
            <input
              type="range"
              value="8"
              min="1"
              max="32"
              class="speedRoll"
              id="passo"
            />
            <output id="passo-valor">8</output>
          </div>
        </div>
      </div>
      <div id="simulacao"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
