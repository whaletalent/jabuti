version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # blockly@13 declares the peer range jsdom >=27.4.0 <31.0.0
    ignore:
      - dependency-name: jsdom
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
